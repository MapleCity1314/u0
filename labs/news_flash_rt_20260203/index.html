<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>时讯快报</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #f97316;
        --border: #e2e8f0;
        --chip: #eef2ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 10%, #fff4e6, var(--bg));
        color: var(--text);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }
      header {
        padding: 24px 20px 12px;
        position: sticky;
        top: 0;
        backdrop-filter: blur(10px);
        background: rgba(246, 247, 251, 0.9);
        border-bottom: 1px solid var(--border);
        z-index: 10;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.2);
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      .controls {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .controls input,
      .controls select,
      .controls button {
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 8px 14px;
        font-size: 13px;
        background: var(--card);
      }
      .controls button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px 20px 40px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 12px;
      }
      .list {
        display: grid;
        gap: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .chip {
        background: var(--chip);
        color: #1d4ed8;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .source {
        color: var(--muted);
        font-size: 12px;
      }
      .title-text {
        font-size: 15px;
        margin: 6px 0 4px;
        line-height: 1.5;
      }
      .summary {
        color: #334155;
        font-size: 13px;
        line-height: 1.6;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        padding: 16px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <span class="dot"></span>
        <h1>时讯快报</h1>
      </div>
      <div class="controls">
        <input id="host" type="text" value="http://127.0.0.1:8080" />
        <select id="market">
          <option value="">全部市场</option>
          <option value="CN">A股/内地</option>
          <option value="HK">港股</option>
          <option value="US">美股</option>
          <option value="MACRO">宏观</option>
          <option value="COMMODITY">大宗</option>
        </select>
        <input id="keyword" type="text" placeholder="关键词" />
        <button id="refresh">刷新</button>
      </div>
    </header>

    <main class="container">
      <div class="meta" id="meta">等待数据...</div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>暂无快讯</div>
    </main>

    <footer>轮询 API: /latest?limit=50</footer>

    <script>
      const listEl = document.getElementById("list");
      const metaEl = document.getElementById("meta");
      const emptyEl = document.getElementById("empty");
      const hostEl = document.getElementById("host");
      const marketEl = document.getElementById("market");
      const keywordEl = document.getElementById("keyword");
      const refreshEl = document.getElementById("refresh");

      async function fetchLatest() {
        const base = hostEl.value.trim().replace(/\/$/, "");
        const url = `${base}/latest?limit=120`;
        metaEl.textContent = "拉取中...";
        try {
          const res = await fetch(url);
          const data = await res.json();
          render(data.items || []);
        } catch (err) {
          metaEl.textContent = "拉取失败，请检查 API 服务器";
          listEl.innerHTML = "";
          emptyEl.hidden = false;
        }
      }

      function render(items) {
        const market = marketEl.value;
        const keyword = keywordEl.value.trim();
        let filtered = items;
        if (market) {
          filtered = filtered.filter((item) => item.market === market);
        }
        if (keyword) {
          filtered = filtered.filter((item) =>
            (item.title || "").includes(keyword) || (item.summary || "").includes(keyword)
          );
        }

        listEl.innerHTML = "";
        emptyEl.hidden = filtered.length > 0;
        metaEl.textContent = `共 ${filtered.length} 条 | 最近更新时间 ${new Date().toLocaleTimeString()}`;

        for (const item of filtered) {
          const card = document.createElement("div");
          card.className = "card";
          const summary = item.summary ? `<div class="summary">${escapeHtml(item.summary)}</div>` : "";
          card.innerHTML = `
            <div class="row">
              <span class="chip">${item.market || "N/A"}</span>
              <span class="source">${escapeHtml(item.source || "")}</span>
              <span class="source">${escapeHtml(item.ts || "")}</span>
            </div>
            <div class="title-text">
              ${item.url ? `<a href="${item.url}" target="_blank">${escapeHtml(item.title || "")}</a>` : escapeHtml(item.title || "")}
            </div>
            ${summary}
          `;
          listEl.appendChild(card);
        }
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      refreshEl.addEventListener("click", fetchLatest);
      keywordEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") fetchLatest();
      });

      fetchLatest();
      setInterval(fetchLatest, 15000);
    </script>
  </body>
</html>
